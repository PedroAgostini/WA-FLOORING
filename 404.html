    .err h1 { font-size: clamp(2rem, 3.6vw, 3rem); line-height: 1.06; font-weight: 700; letter-spacing: -0.025em; color: var(--navy); margin: 0 0 16px; text-wrap: balance; }

    .btn--line { background: transparent; color: var(--navy); box-shadow: inset 0 0 0 1.5px var(--line); }

    .btn svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }

    .err-floor { position: relative; border-radius: 26px; overflow: hidden; box-shadow: var(--shadow-card); background: #5b3a28; }
    .err-floor svg { display: block; width: 100%; height: auto; }

    .err-foot { width: min(1280px, 100% - 2 * var(--gutter)); margin: 0 auto; padding: 22px 0 28px; border-top: 1px solid var(--line); display: flex; flex-wrap: wrap; justify-content: space-between; gap: 8px 24px; font-size: .9rem; color: var(--text-2); position: relative; z-index: 1; }
    .err-foot a { color: var(--navy); }

    @media (max-width: 860px) {
      .err-main { grid-template-columns: 1fr; padding-top: 40px; }
      .err-floor { order: -1; max-width: 520px; }
    }
    @media (max-width: 560px) {

      .err-head .btn { display: none; }
      .err-actions .btn { width: 100%; }
      .err-foot { flex-direction: column; }
    }
